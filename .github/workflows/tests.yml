name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"  # weekly: catches breaking releases of the dependencies

jobs:
  locked:
    name: locked dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q

  newest:
    name: newest dependencies, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --upgrade --python ${{ matrix.python }}
      - run: uv run pytest -q
