# Wordings of the data descriptor (README) that no odML field gives.
# The brain regions of the dataset are openMINDS UBERONParcellation terms
# (openminds_schemas.yaml, DatasetVersion.study_targets); this is how the
# README calls them in its Anatomical Location section.
brain regions label: "Brain regions (terms from the anatomy ontology UBERON)"

# Labels of the Surgical Preparation bullets whose section name and property
# name together repeat a word; other bullets read "<Section> <property>"
subject labels:
  Surgery Details/surgical notes: Surgery
  Surgery Details/surgery date: Surgery date
  Surgery Details/recovery period: Recovery period
  Surgery Details/anesthesia protocol: Anesthesia protocol
  Craniotomy/dura condition: Dura
  Craniotomy/dura treatment: Dura treatment
  Craniotomy/cranial window type: Cranial window type

# A term written out at its first plain mention in the descriptor and in the
# Knowledge Graph descriptions (outside code, links, URLs and the software
# names below), unless the written-out form comes first; later mentions keep
# the short form
first use:
  odML: "open metadata Markup Language (odML)"
  NWB: "Neurodata Without Borders (NWB)"
  BIDS: "Brain Imaging Data Structure (BIDS)"
  EMG: "electromyography (EMG)"
  TSV: "tab-separated values (TSV)"
  JSON: "JavaScript Object Notation (JSON)"
  EDF: "European Data Format (EDF)"
  MRI: "magnetic resonance imaging (MRI)"
  BOLD: "blood-oxygen-level-dependent (BOLD)"
  DOI: "Digital Object Identifier (DOI)"

# The opening of the Data Records: the layout standard ({bids extension} and
# {bids version}, bids_mappings.yaml spec), with ecephys files the sentence on
# where the content of the files is defined, and with a metadata folder the
# part beyond BIDS
layout standard: "The data are organised following the BIDS extension proposal {bids extension}, a draft extension of BIDS {bids version}."
layout standard without ecephys: "The data are organised following BIDS {bids version}."
layout definitions: "The content of the BIDS files is defined in the [BEP032 specification]({bids extension specification})."
layout metadata folder: >-
  Beyond BIDS, the layout holds the folder `{metadata dir}/` with the odML record,
  the canonical record of all metadata of the dataset, and the openMINDS
  metadata; the file table below names every file type.

# The parts of the file names and the data type folders, explained before the
# file tree; only the keys and folders the file names hold are listed ({keys},
# {folders}: "`sub` (subject) and `ses` (session)")
file name keys sentence: "File names are made of key-value pairs and end with the file type: {keys}."
file name keys:
  sub: subject
  ses: session
  task: task, or rest
  run: index of the recording within the session
  acq: acquisition
  recording: recorded signal
data type folders sentence: "The files of a session are in one folder per data type: {folders}."
data type folders:
  ecephys: extracellular electrophysiology
  beh: behaviour
  emg: electromyography
  motion: motion tracking
  anat: anatomical MRI
  func: functional MRI
  fmap: field maps

# Project pages of the software, standards and resources the descriptor names: the first plain mention
# of each name is linked, unless the descriptor already links it (as the
# collection's usage statement does). A tool of the odML Curation Software
# section with a code url is linked to that url instead.
software links:
  BIDS validator: "https://github.com/bids-standard/bids-validator"
  NWB Inspector: "https://nwbinspector.readthedocs.io/"
  openMINDS Python: "https://github.com/openMetadataInitiative/openMINDS_Python"
  NeuroConv: "https://neuroconv.readthedocs.io/"
  PyNWB: "https://pynwb.readthedocs.io/"
  MatNWB: "https://matnwb.readthedocs.io/"
  fairgraph: "https://fairgraph.readthedocs.io/"
  ProbeInterface: "https://probeinterface.readthedocs.io/"
  Matplotlib: "https://matplotlib.org/"
  DataLad: "https://www.datalad.org/"
  python-odml: "https://g-node.github.io/python-odml/"
  pyEDFlib: "https://pyedflib.readthedocs.io/"
  # the standards and resources the descriptor names
  UBERON: "https://obophenotype.github.io/uberon/"
  NWB: "https://nwb.org/"
  BIDS: "https://bids.neuroimaging.io/"
  openMINDS: "https://openminds.om-i.org/"
  odML: "https://g-node.github.io/python-odml/"
  EBRAINS: "https://ebrains.eu/"

# The file types of the Data Records, in the order of the file table; the file
# tree gives the one-sentence description (tree) in square brackets after
# every file of the type (the EBRAINS data descriptor template); the files of
# one folder with the same description share one line. tree by stem: the
# description of the files of that name instead.
# A file takes the first entry whose pattern matches the end of its path
# relative to the dataset root ({metadata dir}: the curated metadata folder).
# signals: the kind of the physio files (eyetrack for a recording-eye* label, else generic) worded
# ({signals}, {Signals} at the start of a sentence; a missing PhysioType is
# generic, as in BIDS).
# suffixes: the BIDS suffixes of the file names ({suffixes}: "T1w and T2w").
# per suffix: one row per file suffix ("*_video.MTS"; {suffix} in the texts).
# labels: the values of this BIDS entity in the file names ({labels}).
# stale content: the content when the first file is older than the odML
# record beside it ({built}: its date).
# device type: the Hardware Auxiliary Devices of this device type give
# {camera} (manufacturer and model) and {recording software} (with its
# software version), each as a prose list; empty when none names them.
files:
  - pattern: "*_ecephys.nwb"
    tree: "continuous neural recording with its electrodes, devices and subject metadata"
    format: NWB (HDF5)
    content: Continuous neural recording with its electrode table, devices and subject metadata
  - pattern: "*_ecephys.json"
    tree: "recording parameters of the matching NWB file: sampling frequency, filters and recording system"
    format: JSON
    content: >-
      Recording parameters of the matching NWB file: sampling frequency, power
      line frequency, filters, recording system and institution
  - pattern: "ecephys/*_channels.tsv"
    tree: "one row per recorded channel"
    format: TSV
    content: "One row per recorded channel: its electrode contact, signal type, unit, sampling frequency, reference, gain and status"
  - pattern: "ecephys/*_channels.json"
    tree: "descriptions of the columns of the matching channels.tsv"
    format: JSON
    content: Descriptions of the columns of the matching channels.tsv
  - pattern: "*_electrodes.tsv"
    tree: "one row per electrode contact, with its position"
    format: TSV
    content: "One row per electrode contact: its probe, position within the probe, hemisphere and brain region"
  - pattern: "*_electrodes.json"
    tree: "descriptions of the columns of the matching electrodes.tsv"
    format: JSON
    content: Descriptions of the columns of the matching electrodes.tsv
  - pattern: "*_probes.tsv"
    tree: "one row per probe placed in the session"
    format: TSV
    content: "One row per probe placed in the session: its type, placement coordinates and angles, brain region, manufacturer and model"
  - pattern: "*_probes.json"
    tree: "descriptions of the columns of the matching probes.tsv"
    format: JSON
    content: Descriptions of the columns of the matching probes.tsv
  - pattern: "*_events.tsv"
    tree: "one row per event or annotated interval of the recording"
    format: TSV
    content: "One row per event or annotated interval: its onset, duration and type"
  - pattern: "*_events.json"
    tree: "descriptions of the columns of the matching events.tsv"
    format: JSON
    content: Descriptions of the columns of the matching events.tsv
  - pattern: "*_physio.tsv.gz"
    tree: "{signals} of the recording, one column per signal"
    format: TSV (gzip)
    labels: recording
    signals:
      eyetrack: eye-tracking signals
      generic: physiological signals
    content: "{Signals}{? ({labels})}, one column per signal and no header row"
  - pattern: "*_physio.json"
    tree: "column names, sampling frequency and start time of the matching physio.tsv.gz"
    format: JSON
    content: Column names, units, sampling frequency and start time of the matching physio.tsv.gz
  - pattern: "*_motion.tsv"
    tree: "motion tracking signals of the recording, one column per channel"
    format: TSV
    content: >-
      Motion tracking signals, one column per channel of the matching
      channels.tsv and no header row
  - pattern: "*_motion.json"
    tree: "recording parameters of the motion tracking"
    format: JSON
    content: >-
      Recording parameters of the motion tracking: sampling frequency, channel
      counts and tracking system
  - pattern: "motion/*_channels.tsv"
    tree: "one row per motion tracking channel"
    format: TSV
    content: "One row per motion tracking channel"
  - pattern: "*_emg.edf"
    tree: "electromyography signals of the recording, one signal per channel"
    format: EDF
    content: >-
      Electromyography signals of the recording, one signal per channel of the
      matching channels.tsv
  - pattern: "*_emg.json"
    tree: "recording parameters of the electromyography"
    format: JSON
    content: >-
      Recording parameters of the electromyography: sampling frequency, power
      line frequency, channel count, filters and recording system
  - pattern: "emg/*_channels.tsv"
    tree: "one row per EMG channel"
    format: TSV
    content: "One row per EMG channel: its signal type, unit, sampling frequency and status"
  - pattern: "*_channels.tsv"
    tree: "one row per channel"
    format: TSV
    content: "One row per channel"
  - pattern: "*_channels.json"
    tree: "descriptions of the columns of the matching channels.tsv"
    format: JSON
    content: Descriptions of the columns of the matching channels.tsv
  - pattern: "*_video.json"
    tree: "metadata of the matching video file, such as its frame rate and format"
    format: JSON
    content: Metadata of the matching video file, such as its frame rate and format
    device type: video camera
  - pattern: "*_video.*"
    per suffix: true
    tree: "video recording"
    format: "Video ({suffix})"
    content: Video recording
    device type: video camera
  - pattern: dataset_description.json
    tree: "name, BIDS version, licence, authors, funding and references of the dataset"
    format: JSON
    content: >-
      Name, BIDS version, licence, authors, funding, references and the
      software that generated the dataset
  - pattern: participants.tsv
    tree: "one row per subject"
    format: TSV
    content: "One row per subject: species, sex, age and weight"
  - pattern: participants.json
    tree: "descriptions of the columns of participants.tsv"
    format: JSON
    content: Descriptions of the columns of participants.tsv
  - pattern: "*_scans.tsv"
    tree: "one row per data file of the session"
    format: TSV
    content: Start time of each data file of the session
  - pattern: "*_scans.json"
    tree: "descriptions of the columns of the matching scans.tsv"
    format: JSON
    content: Descriptions of the columns of the matching scans.tsv
  - pattern: "anat/*.nii.gz"
    tree: "anatomical MR image of the subject"
    format: NIfTI (gzip)
    suffixes: true
    content: "Anatomical MR images of the subject{? ({suffixes})}"
  - pattern: "anat/*.json"
    tree: "acquisition parameters of the matching anatomical image"
    format: JSON
    content: Acquisition parameters of the matching anatomical image
  - pattern: "func/*_bold.nii.gz"
    tree: "BOLD time series of one functional MRI run"
    format: NIfTI (gzip)
    content: Functional MRI time series of the BOLD signal, one file per run
  - pattern: "func/*_bold.json"
    tree: "acquisition parameters of the matching BOLD time series"
    format: JSON
    content: Acquisition parameters of the matching BOLD time series
  - pattern: "fmap/*.nii.gz"
    tree: "field map image of the session"
    format: NIfTI (gzip)
    suffixes: true
    content: "Field map images of the session{? ({suffixes})}"
  - pattern: "fmap/*.json"
    tree: "acquisition parameters of the matching field map image"
    format: JSON
    content: Acquisition parameters of the matching field map image
  - pattern: "*.nrrd"
    tree: "image volume in the Nearly Raw Raster Data format"
    format: NRRD
    content: >-
      Image volume in the Nearly Raw Raster Data format: a text header with its
      dimensions and encoding, followed by the data
  - pattern: "*.mrk.json"
    tree: "3D Slicer markups with the positions of their control points"
    format: JSON (3D Slicer markups)
    content: >-
      3D Slicer markups: the type of each markup (such as a point list or a
      line) and the positions of its control points
  - pattern: datacite.yml
    tree: "citation metadata for the DOI registration on GIN"
    format: YAML
    content: >-
      Citation metadata for the DOI registration on GIN: title, authors,
      description, keywords, licence, funding and references
  - pattern: LICENSE
    tree: "licence of the dataset with its legal code"
    format: Text
    content: Licence of the dataset with its legal code
  - pattern: "probes/*.json"
    tree: "contact geometry of one probe and the wiring of its contacts to the recording channels"
    format: JSON (ProbeInterface)
    content: >-
      Contact geometry of each probe: contact positions and shapes and the
      wiring to the recording channels
  - pattern: "probes/sub-*_ses-*/*.json"
    tree: &probe_tree "contact geometry of each probe, as data and as a drawing"
    tree by stem:
      probe_group: "contact geometry of all probes of the session"
    format: JSON (ProbeInterface)
    content: >-
      Contact geometry of each probe: contact positions and shapes and the
      wiring to the recording channels
  - pattern: "probes/sub-*_ses-*/*.png"
    tree: *probe_tree
    format: PNG
    content: &probe_drawing Drawing of each probe with more than one contact
  - pattern: "probes/sub-*/*.json"
    tree: *probe_tree
    tree by stem:
      probe_group: "contact geometry of all probes implanted in the subject"
    format: JSON (ProbeInterface)
    content: >-
      Contact geometry of each probe implanted in the subject: contact
      positions and shapes and the wiring to the recording channels
  - pattern: "probes/sub-*/*.png"
    tree: *probe_tree
    format: PNG
    content: *probe_drawing
  - pattern: README.md
    tree: "this data descriptor"
    format: Markdown
    content: This data descriptor
  - pattern: "{metadata dir}/*.odml.*"
    tree: "all metadata of the dataset in one record, in three formats"
    format: XML, YAML, HTML
    content: odML record with all metadata of the dataset (XML, YAML and an HTML viewer)
  - pattern: "{metadata dir}/*.openminds.jsonld"
    tree: "openMINDS metadata of the dataset for the EBRAINS Knowledge Graph"
    format: JSON-LD (openMINDS)
    content: >-
      openMINDS metadata of the dataset for the EBRAINS Knowledge Graph,
      derived from the odML record
    stale content: >-
      openMINDS metadata of the dataset for the EBRAINS Knowledge Graph, from
      an earlier state of the odML record (built on {built})
  - pattern: "{metadata dir}/*.instances.yaml"
    tree: "for each metadata value chosen from a fixed list, such as the species or a brain region, the standard term and its web address"
    format: YAML
    content: openMINDS terms of the controlled vocabulary values in the odML record
