# Subject Template Schema v1
$schema: https://json-schema.org/draft-07/schema#
title: Subject Template
version: 1

type: object
# One subject ('Subject') or several ('Subjects', one 'Subject' entry each,
# compiled into one document; each session names its subject). With both,
# the compiler takes 'Subjects' and warns.
if: {not: {required: [Subjects]}}
then: {required: [Subject]}

properties:
  _schema:
    const: subject.v1
  _valueOrigin:
    type: string

  Subjects:
    type: array
    minItems: 1
    items:
      type: object
      required: [Subject]
      properties:
        Subject: {$ref: "#/definitions/Subject"}

  Subject: {$ref: "#/definitions/Subject"}

definitions:
  Subject:
    type: object
    required: [subject id, species, biological sex]
    # The lab's record keys and birth dates stay private like the names: no
    # field holds them (the age is 'age'), and these keys are rejected
    propertyNames: {not: {enum: [internal identifier, birth date]}}
    properties:
      # Identity
      # Pseudonym, never the animal's name (it becomes the BIDS participant
      # label, NWB subject_id and the KG identifier). Alphanumeric only.
      subject id: {type: string, pattern: "^[A-Za-z0-9]+$"}

      # Biology -> Subject.species, .biological_sex; SubjectState.age_category, .handedness
      species: {type: string, pattern: "^[A-Z][a-z]+ [a-z]+$"}
      biological sex: {enum: [male, female, hermaphrodite, not detectable, ""]}
      age category:
        enum: [adult, young adult, prime adult, late adult, adolescent,
               juvenile, infant, neonate, perinatal, embryo, ""]
      # Handedness: openMINDS Handedness controlled terms (must include "handedness" suffix)
      handedness:
        enum: [left handedness, right handedness, ambidextrous handedness,
               mixed handedness, ambilevous handedness, ""]
      genetic strain type: {type: string}
      strain rrid: {type: string}   # Research Resource Identifier for the strain (e.g. "RRID:MGI:2160440")

      # Health -> SubjectState.pathologies (Disease, DiseaseModel)
      disease: {type: string}
      disease model: {type: string}
      phenotype: {type: string}

      # Physical: value + expanded unit name (openMINDS convention)
      age: {type: string, pattern: "^(\\d+(\\.\\d+)?\\s+(year|month|week|day)|)$"}
      # the date the stated age refers to (ISO date), empty when the lab gave none
      age reference date: {type: string, pattern: "^(\\d{4}-\\d{2}-\\d{2}|)$"}
      weight: {type: string, pattern: "^(\\d+(\\.\\d+)?\\s+(kilogram|gram)|)$"}

      # Notes
      notes: {type: string}

      # Housing
      housing condition: {type: string}
      pathogen status: {type: string}
      breeding type: {type: string}

      # State
      subject attribute:
        type: array
        items: {type: string}

      # Surgical
      Surgical Preparation:
        type: object
        properties:
          preparation type: {enum: [in vivo, ex vivo, in vitro]}
          Head Post: {type: object}
          Recording Chamber: {type: object}
          Craniotomy: {type: object}
          Surgery Details: {type: object}
          Implanted Probes:
            type: [array, "null"]
            items:
              type: object
              properties:
                probe: {type: string, description: Exact name of a Hardware.Probes entry}
                brain region: {type: string}
                hemisphere: {enum: [left, right, ""]}
                channels:
                  type: string
                  pattern: "^(\\d+(-\\d+)?(,\\s*\\d+(-\\d+)?)*)?$"
                  description: Acquisition channels of this array, 1-based positions in the curated stream
                stream:
                  type: string
                  description: The recording stream of this array, for formats with several streams per file (e.g. SpikeGLX imec0)
                electrode identifiers:
                  type: array
                  items: {type: string}
                  description: >-
                    Contact ids of the device (Hardware.Probes) in the order of 'channels',
                    when the channels do not follow the contact order (as for an acute placement)
                AP: {type: string, pattern: "^(-?[\\d.]+\\s*\\w+)?$"}
                ML: {type: string, pattern: "^(-?[\\d.]+\\s*\\w+)?$"}
                depth: {type: string, pattern: "^(-?[\\d.]+\\s*\\w+)?$"}
                implant date: {type: string}
                anatomical targets: {type: object, additionalProperties: {type: string}}
