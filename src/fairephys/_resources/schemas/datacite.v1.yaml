# DataCite Output Schema v1
# For GIN DOI registration (DataCite Metadata Schema 4.1)
$schema: https://json-schema.org/draft-07/schema#
title: DataCite Metadata
version: 1

type: object
required: [authors, title, description, keywords, license, resourcetype, templateversion]

properties:
  authors:
    type: array
    minItems: 1
    items:
      type: object
      required: [firstname, lastname]
      properties:
        firstname: {type: string}
        lastname: {type: string}
        affiliation: {type: string}
        id: {type: string, pattern: "^(ORCID|ROR|ISNI):.*"}

  title: {type: string, minLength: 1}

  description: {type: string, minLength: 1}

  keywords:
    type: array
    minItems: 1
    items: {type: string}

  license:
    type: object
    required: [name, url]
    properties:
      name: {type: string}
      url: {type: string, format: uri}

  funding:
    type: array
    items: {type: string}

  references:
    type: array
    items:
      type: object
      required: [id, reftype, citation]
      properties:
        id: {type: string}
        # DataCite relationType (GIN recommends IsSupplementTo, IsDescribedBy, IsReferencedBy)
        reftype:
          enum: [IsCitedBy, Cites, IsSupplementTo, IsSupplementedBy, IsContinuedBy, Continues,
                 IsDescribedBy, Describes, HasMetadata, IsMetadataFor, HasVersion, IsVersionOf,
                 IsNewVersionOf, IsPreviousVersionOf, IsPartOf, HasPart, IsPublishedIn, IsReferencedBy,
                 References, IsDocumentedBy, Documents, IsCompiledBy, Compiles, IsVariantFormOf,
                 IsOriginalFormOf, IsIdenticalTo, IsReviewedBy, Reviews, IsDerivedFrom, IsSourceOf,
                 IsRequiredBy, Requires, IsObsoletedBy, Obsoletes, IsCollectedBy, Collects]
        citation: {type: string}

  resourcetype: {enum: [Dataset, Software, Text, Preprint]}
  templateversion: {const: 1.2}  # GIN DataCite Schema 4.1
