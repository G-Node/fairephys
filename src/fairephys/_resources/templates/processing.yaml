# Data Processing template
# Copy to your dataset's metadata/ folder and fill in values
#
# Each item is a separate processing step -> openMINDS computation.DataAnalysis
# Only include steps that were actually performed; omit the rest
#
# technique: openMINDS AnalysisTechnique controlled term, e.g.:
#   spike sorting, signal filtering technique, signal processing technique,
#   video annotation, current source density analysis, temporal filtering,
#   independent component analysis, motion analysis, eye movement analysis

_schema: processing.v1
_valueOrigin: ""

