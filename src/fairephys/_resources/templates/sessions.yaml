# Recording sessions template
# Copy to your dataset's metadata/ folder and fill in values
#
# Session identifiers and programmatic data only
# Recording configuration (techniques, placements) goes in recordings.yaml

_schema: sessions.v1
_valueOrigin: ""

# =============================================================================
# SESSION DEFAULTS
# =============================================================================
Session Defaults:
  description: ""

# =============================================================================
# SESSIONS
# =============================================================================
Sessions:
  - session id: session001  # replace with actual session ID (lowercase alphanumeric)
    # subject: SubjectA       # several subjects: the subject id of this session
    # task: taskA             # several tasks in one session: one entry per task
    #                         # (same session id), with its BIDS task label
    # task description: ""    # what that task was, when it differs from the
    #                         # Behavioral Protocol description
    date: 2024-01-01  # YYYY-MM-DD format
    session number: 1
    description: ""
    notes: ""
    start time: ""             # -> RecordingActivity.start_time
    end time: ""               # -> RecordingActivity.end_time
    duration: ""               # e.g., "53 minute", "1205 second" (second | minute | hour)

    # Cross-references (link to protocol, hardware, and experimenter)
    behavioral protocol: ""  # References Behavioral Protocol.name
    recording system: ""     # References Hardware.Recording System
    performed by: ""         # Family name of experimenter (must match Contributors) -> RecordingActivity.performed_by

    # Recording metadata (fallback, filled by the Neo enrichment when available)
    # continuity: continuous | discontinuous | epoched (one or several
    # segments; the BIDS RecordingType, not the acute/chronic recording type)
    continuity: ""
    sampling rate: ""         # e.g., "30000 hertz" (hertz | kilohertz)
    # number of channels: null  # integer or null if unknown

    # Electrode placements (which device went where) go in recordings.yaml

    # Auxiliary channels available in this session
    # auxiliary channels: []
